name: Проверка приложения
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm test
      - name: Проверить Docker и запуск сервера
        run: |
          docker build --tag konditerka:test .
          docker run -d --rm --name konditerka-smoke -e OWNER_EMAIL=test@example.com -e OWNER_PASSWORD="$(openssl rand -hex 24)" -e APP_ORIGIN=http://localhost:3000 -p 127.0.0.1:3000:3000 konditerka:test
          trap 'docker logs konditerka-smoke; docker rm -f konditerka-smoke' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors --max-time 3 http://localhost:3000/health
